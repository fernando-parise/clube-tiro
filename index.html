<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' blob: data:; media-src blob:; connect-src https://api.github.com https://api.anthropic.com https://api.groq.com; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clube Tiro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topo">
    <div class="marca">Clube<span>Tiro</span></div>
    <nav>
      <button data-tela="consultar" class="ativo">Consultar</button>
      <button data-tela="lancar">Lançar</button>
    </nav>
    <div class="acoes">
      <button id="btn-tema" title="Alternar tema">Tema</button>
      <button id="btn-config" title="Configuração">Config</button>
    </div>
  </header>

  <main>
    <section id="tela-consultar" class="tela">
      <h1>Consultar</h1>
      <div class="linha">
        <label class="campo" style="flex:1;margin:0"><input id="cons-busca" placeholder="Buscar em título, texto e tags..."></label>
      </div>
      <div id="cons-home">
        <div class="grade-categorias" id="cons-categorias"></div>
      </div>
      <div id="cons-vista-lista" class="oculta">
        <div class="linha cons-toolbar">
          <button class="btn" id="cons-voltar">← Categorias</button>
          <span id="cons-contador" class="progresso"></span>
          <button class="btn" id="cons-pdf-lista">PDF desta lista</button>
          <button class="btn" id="cons-pdf-tudo">PDF de tudo</button>
        </div>
        <div class="consultar-grade">
          <div id="cons-lista"></div>
          <div id="cons-nota" class="card oculta"></div>
        </div>
      </div>
    </section>

    <section id="tela-lancar" class="tela oculta">
      <h1>Lançar</h1>
      <div class="card" id="lancar-entrada">
        <label class="campo"><span>JSON do claude.ai ou texto copiado do WhatsApp</span><textarea id="lancar-texto" placeholder="Cole aqui o JSON gerado no seu Projeto do claude.ai, ou as mensagens copiadas do WhatsApp"></textarea></label>
        <label class="campo"><span>Arquivos: export do WhatsApp (.zip ou .txt), áudios, fotos, documentos (PDF, PPT, DOC, XLS)</span>
          <input id="lancar-arquivos" type="file" multiple accept=".zip,.txt,.opus,.ogg,.m4a,.mp3,.wav,.jpg,.jpeg,.png,.webp,.pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.csv"></label>
        <div class="linha">
          <button class="btn btn-primario" id="lancar-processar">Processar JSON</button>
          <button class="btn" id="lancar-manual">Nota manual</button>
          <span id="lancar-status" class="progresso"></span>
        </div>
      </div>
      <div id="lancar-revisao" class="oculta">
        <h2>Revisão</h2>
        <p class="progresso">Confira, ajuste e grave. Nada foi gravado ainda.</p>
        <div id="lancar-cards"></div>
        <div class="linha">
          <button class="btn btn-primario" id="lancar-gravar">Gravar tudo</button>
          <button class="btn" id="lancar-cancelar">Descartar</button>
          <span id="lancar-progresso" class="progresso"></span>
        </div>
      </div>
    </section>

    <section id="tela-config" class="tela oculta">
      <h1>Configuração</h1>
      <div class="card">
        <h3>GitHub (dados)</h3>
        <label class="campo"><span>Usuário do GitHub</span><input id="cfg-ghUser" autocomplete="off" placeholder="fernando-parise"></label>
        <label class="campo"><span>Repositório privado de dados</span><input id="cfg-ghRepo" autocomplete="off" value="clube-tiro-anotacoes"></label>
        <label class="campo"><span>Token fine-grained (Contents: read/write só nesse repositório)</span><input id="cfg-ghToken" type="password" autocomplete="off"></label>
        <div class="linha"><button class="btn" id="cfg-testar-gh">Testar GitHub</button><span id="cfg-res-gh" class="progresso"></span></div>
      </div>
      <div class="card">
        <h3>Claude (estruturação das notas)</h3>
        <label class="campo"><span>Chave da API (console.anthropic.com) — opcional: só para estruturar direto no app; sem ela, cole o JSON gerado no seu Projeto do claude.ai</span><input id="cfg-claudeKey" type="password" autocomplete="off"></label>
        <div class="linha"><button class="btn" id="cfg-testar-claude">Testar Claude</button><span id="cfg-res-claude" class="progresso"></span></div>
      </div>
      <div class="card">
        <h3>Groq (transcrição de áudio)</h3>
        <label class="campo"><span>Chave da API (console.groq.com) — opcional: só para transcrever áudio no app</span><input id="cfg-groqKey" type="password" autocomplete="off"></label>
      </div>
      <div class="linha">
        <button class="btn btn-primario" id="cfg-salvar">Salvar</button>
        <button class="btn btn-perigo" id="cfg-limpar">Limpar tudo</button>
      </div>
    </section>
  </main>

  <div id="aviso" class="aviso oculta"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" integrity="sha384-+mbV2IY1Zk/X1p/nWllGySJSUN8uMs+gUAN10Or95UBH0fpj6GfKgPmgC5EXieXG" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="js/config.js"></script>
  <script src="js/notas.js"></script>
  <script src="js/whatsapp-parser.js"></script>
  <script src="js/github-api.js"></script>
  <script src="js/imagem.js"></script>
  <script src="js/transcricao.js"></script>
  <script src="js/lancar.js"></script>
  <script src="js/consultar.js"></script>
  <script src="js/claude.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
